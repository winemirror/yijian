server {
    listen 80;
    server_name c.syjnb.top;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name c.syjnb.top;

    ssl_certificate     /etc/letsencrypt/live/c.syjnb.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/c.syjnb.top/privkey.pem;

    # 信令 WebSocket：长连接，关闭缓冲并延长超时。
    location /ws {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /health {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
    }

    # Wukong 在线棋库：只读 JSON API，由 game-library.mjs 提供。
    location ^~ /api/games {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 30s;
    }

    location / {
        return 404;
    }
}

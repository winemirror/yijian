# 弈鉴 · coturn 配置示例
#
# 3.0 实际只用到 STUN。TURN 的"开关"其实在信令服务端：服务端不返回 TURN 条目，
# 客户端就不会走中继。下面把 TURN 也一并配好，将来要在信令服务端打开，
# 只需设置 TURN_URL / TURN_SECRET 两个环境变量，客户端一行都不用改。
#
# 放 /etc/coturn/turnserver.conf，或用 -c 指定。

listening-port=3478
fingerprint

# 机器在 NAT 后面时**必须**显式写公网 IP，否则 STUN 返回的地址是错的
external-ip=换成你的公网IP

# ── TURN：REST 临时凭证（与信令服务端的 TURN_SECRET 保持一致）──
use-auth-secret
static-auth-secret=换成一段足够长的随机字符串
realm=yijian.example.com

# TURN 中继端口范围。3.0 不用 TURN 时，这段端口可以不对外开放。
min-port=49160
max-port=49200

# 减少暴露面
no-cli
no-multicast-peers

# 日志
log-file=/var/log/coturn.log
simple-log

# 弈鉴 · coturn 配置模板（STUN + TURN REST 临时凭证）
#
# 三个占位符由 deploy.sh 渲染：
#   __PUBLIC_IP__    这台机器的公网 IP（coturn 的 external-ip）
#   __TURN_SECRET__  与信令服务端 TURN_SECRET 完全一致的密钥
#   __REALM__        coturn realm，默认取公网 IP
#
# 用法二选一：
#   1. 自动：在服务器上设 PUBLIC_IP / TURN_SECRET，加 INSTALL_COTURN=1 跑 deploy.sh
#   2. 手动：把三个占位符换成实际值，存成 /etc/turnserver.conf，
#      再 `chown root:turnserver && chmod 640`，然后 systemctl restart coturn

listening-port=3478
fingerprint

# 机器在 NAT 后面时**必须**显式写公网 IP，否则 STUN/TURN 返回的地址是错的
external-ip=__PUBLIC_IP__

# ── TURN：REST 临时凭证 ──
# 信令服务端用同一个 secret 现场签发 username/credential，
# 客户端拿到的是分钟级有效的一次性凭证，静态密码从不下发。
use-auth-secret
static-auth-secret=__TURN_SECRET__
realm=__REALM__

# 中继端口范围。每路中继各占一个端口，两端都在 CGNAT 后面时靠它中转；
# 不启用 TURN 时这段端口可以不对外开放。
min-port=49160
max-port=49200

# 减少暴露面
no-cli
no-multicast-peers
